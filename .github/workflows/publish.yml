name: publish Erdmier.DomainCore to NuGet
on:
  workflow_dispatch:
  pull_request:
    branches:
      - release/core # Your default release branch
    paths:
      - 'Source/DomainCore/**'
jobs:
  publish:
    name: list Erdmier.DomainCore on nuget.org
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Required for a specific dotnet version that doesn't come with ubuntu-latest / windows-latest
      # Visit bit.ly/2synnZl to see the list of SDKs that are pre-installed with ubuntu-latest / windows-latest
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Publish
      - name: publish on version change
        uses: alirezanet/publish-nuget@v3.1.0
        with:
          PROJECT_FILE_PATH: Source/DomainCore/DomainCore.csproj # Relative to the repository root
          VERSION_FILE_PATH: Source/DomainCore/DomainCore.csproj # Filepath with version info, relative to the repository root. Defaults to the project file.
          VERSION_REGEX: <Version>(.*)<\/Version> # Regex pattern to extract version info in a capturing group
          TAG_COMMIT: true # Flag to enable / disable git tagging
          TAG_FORMAT: DomainCore-v* # Format of the git tag, [*] gets replaced with the version
          NUGET_KEY: ${{secrets.NUGET_API_KEY}} # nuget.org API key
  sync-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: merge release into main
        uses: devmasx/merge-branch@master
        with:
          type: now
          target_branch: main
          message: Merge release/core into main
          github_token: ${{ secrets.GITHUB_TOKEN }}
